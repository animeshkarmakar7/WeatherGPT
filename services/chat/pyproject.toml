[project]
name = "weathergpt-chat"
version = "0.5.0"
description = "WeatherGPT Chat Service, Weather Agent and RAG Knowledge Base"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langgraph>=0.2.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "psycopg[binary]>=3.2.0",
    "psycopg_pool>=3.2.0",
    "redis>=5.0.0",
    "httpx>=0.27.0",
    "minio>=7.2.0",
    "rank-bm25>=0.2.2",
    "qdrant-client>=1.11.0",
    "python-multipart>=0.0.9",
    "pymupdf>=1.24.0",
    "FlagEmbedding>=1.3.0",
    "openai>=1.70.0",
    "ragas>=0.4.0,<0.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
