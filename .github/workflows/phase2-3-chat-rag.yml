name: phase2-3-chat-rag

on:
  push:
    branches: [main]
    paths:
      - "services/chat/**"
      - "services/frontend/**"
      - "docker-compose.yml"
      - "docker-compose.llm.yml"
      - ".github/workflows/phase2-3-chat-rag.yml"
  pull_request:
    paths:
      - "services/chat/**"
      - "services/frontend/**"
      - "docker-compose.yml"
      - "docker-compose.llm.yml"
      - ".github/workflows/phase2-3-chat-rag.yml"

jobs:
  chat-rag:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/chat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -U pip && python -m pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q weathergpt_chat
      - name: Tests
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
