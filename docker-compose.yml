services:
  timescaledb:
    image: timescale/timescaledb-ha:pg16.15-ts2.30.0
    environment:
      POSTGRES_DB: weathergpt
      POSTGRES_USER: weathergpt
      POSTGRES_PASSWORD: weathergpt
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
      TIMESCALEDB_TELEMETRY: "off"
    ports:
      - "5432:5432"
    volumes:
      - timescale-data:/home/postgres/pgdata/data
      - ./infra/db/001_phase1_ingestion.sql:/docker-entrypoint-initdb.d/001_phase1_ingestion.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -U weathergpt -d weathergpt &&
          test "$(psql -U weathergpt -d weathergpt -tAc
          \"SELECT (SELECT COUNT(*) FROM pg_extension WHERE extname IN ('timescaledb','postgis')) = 2
          AND EXISTS (SELECT 1 FROM information_schema.tables WHERE table_schema='public' AND table_name='weather_observations')
          AND EXISTS (SELECT 1 FROM timescaledb_information.hypertables WHERE hypertable_name='weather_observations');\")" = "t"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 15
    restart: unless-stopped

  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - |
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic weather.raw.open_meteo.current.v1 --partitions 6 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic weather.raw.noaa.forecast.v1 --partitions 6 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic weather.raw.imd.bulletin.v1 --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic weather.raw.imd.current.v1 --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic weather.raw.wis2.notification.v1 --partitions 6 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic weather.normalized.observation.v1 --partitions 12 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic weather.dlq.ingestion.v1 --partitions 3 --replication-factor 1

  minio:
    image: quay.io/minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: weathergpt
      MINIO_ROOT_PASSWORD: weathergpt-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped

  ingestion-api:
    build:
      context: ./services/ingestion
    environment:
      WEATHERGPT_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      WEATHERGPT_REDIS_URL: redis://redis:6379/0
      WEATHERGPT_DATABASE_URL: postgresql+psycopg://weathergpt:weathergpt@timescaledb:5432/weathergpt
      WEATHERGPT_DATABASE_POOL_MIN_SIZE: 2
      WEATHERGPT_DATABASE_POOL_MAX_SIZE: 10
    ports:
      - "8081:8081"
    depends_on:
      timescaledb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  observation-writer:
    build:
      context: ./services/ingestion
    command: python -m weathergpt_ingestion.workers.observation_writer
    environment:
      WEATHERGPT_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      WEATHERGPT_KAFKA_OBSERVATION_WRITER_GROUP_ID: weathergpt-observation-writers-v1
      WEATHERGPT_KAFKA_CONSUMER_MAX_POLL_RECORDS: 50
      WEATHERGPT_KAFKA_CONSUMER_MAX_POLL_INTERVAL_MS: 300000
      WEATHERGPT_DATABASE_URL: postgresql+psycopg://weathergpt:weathergpt@timescaledb:5432/weathergpt
      WEATHERGPT_DATABASE_POOL_MIN_SIZE: 2
      WEATHERGPT_DATABASE_POOL_MAX_SIZE: 10
    depends_on:
      timescaledb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  ingestion-worker:
    build:
      context: ./services/ingestion
    command: celery -A weathergpt_ingestion.workers.celery_app worker --loglevel=INFO
    environment:
      WEATHERGPT_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      WEATHERGPT_REDIS_URL: redis://redis:6379/0
      WEATHERGPT_DATABASE_URL: postgresql+psycopg://weathergpt:weathergpt@timescaledb:5432/weathergpt
      WEATHERGPT_DATABASE_POOL_MIN_SIZE: 2
      WEATHERGPT_DATABASE_POOL_MAX_SIZE: 10
    depends_on:
      timescaledb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  ingestion-beat:
    build:
      context: ./services/ingestion
    command: celery -A weathergpt_ingestion.workers.celery_app beat --loglevel=INFO
    environment:
      WEATHERGPT_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      WEATHERGPT_REDIS_URL: redis://redis:6379/0
      WEATHERGPT_DATABASE_URL: postgresql+psycopg://weathergpt:weathergpt@timescaledb:5432/weathergpt
      WEATHERGPT_DATABASE_POOL_MIN_SIZE: 2
      WEATHERGPT_DATABASE_POOL_MAX_SIZE: 10
    depends_on:
      ingestion-worker:
        condition: service_started
    restart: unless-stopped

  spark-streaming:
    image: bitnami/spark:3.5
    profiles: ["streaming"]
    command:
      - /opt/bitnami/spark/bin/spark-submit
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1,org.postgresql:postgresql:42.7.3
      - /app/weathergpt_ingestion/streaming/spark_kafka_to_timescale.py
    environment:
      WEATHERGPT_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      WEATHERGPT_JDBC_DATABASE_URL: jdbc:postgresql://timescaledb:5432/weathergpt
      WEATHERGPT_DATABASE_USER: weathergpt
      WEATHERGPT_DATABASE_PASSWORD: weathergpt
      WEATHERGPT_SPARK_CHECKPOINT_LOCATION: /checkpoints/kafka-normalized-to-staging
    volumes:
      - ./services/ingestion/weathergpt_ingestion:/app/weathergpt_ingestion:ro
      - spark-checkpoints:/checkpoints
    depends_on:
      timescaledb:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  timescale-data:
  minio-data:
  spark-checkpoints:
