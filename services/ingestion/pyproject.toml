[project]
name = "weathergpt-ingestion"
version = "0.1.0"
description = "WeatherGPT Phase 1 data ingestion service"
requires-python = ">=3.11"
dependencies = [
    "aiokafka>=0.10.0",
    "celery[redis]>=5.4.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "paho-mqtt>=2.1.0",
    "pydantic-settings>=2.4.0",
    "pydantic>=2.8.0",
    "psycopg[binary]>=3.2.0",
    "redis>=5.0.0",
    "tenacity>=8.5.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
]
spark = [
    "pyspark>=3.5.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
